name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, analyse, tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/api }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: silaris_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, gd, intl, zip, bcmath, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Style (Pint)
        run: ./vendor/bin/pint --test
      - name: Analyse statique (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Tests (unitaires + architecture + feature)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: silaris_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          APP_KEY: base64:c2lsYXJpcy1jaS10ZXN0LWtleS0zMmJ5dGVzISFhYmM=
        run: php -d memory_limit=512M artisan test

  frontend:
    name: Frontend (types, build, dérive client API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @silaris/web exec tsc --noEmit
      - name: Build production
        run: pnpm --filter @silaris/web build
        env:
          NEXT_PUBLIC_API_URL: https://api.silaris.example/api
      - name: Dérive du client API (spec committée vs générée)
        run: |
          pnpm --filter @silaris/api-client generate
          git diff --exit-code packages/api-client/src/generated/ \
            || (echo "::error::Client API désynchronisé — lancez 'make openapi' et committez." && exit 1)

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: silaris, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_pgsql, gd, intl, zip, bcmath, pcntl", coverage: none }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: apps/api
      - name: Base + démo + API
        working-directory: apps/api
        env: &laravel-env
          # Sans APP_ENV, Laravel prend « production » par défaut → DemoTenantSeeder
          # se bloque (garde-fou app()->environment('production')) et les données démo
          # ne sont jamais créées → E2E rouge. On force un env non-prod.
          APP_ENV: local
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: silaris
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: cookie
          APP_KEY: base64:c2lsYXJpcy1jaS10ZXN0LWtleS0zMmJ5dGVzISFhYmM=
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --class=DemoTenantSeeder --force
          php artisan serve --port=8088 &
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silaris/web exec playwright install chromium --with-deps
      - name: Front + tests navigateur
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8088/api
          E2E_BASE_URL: http://localhost:3000
        run: |
          pnpm --filter @silaris/web dev &
          npx wait-on http://localhost:3000/login http://localhost:8088/api/v1/health -t 90000
          # Warmup : chauffe le boot Laravel + la route login (php artisan serve est froid
          # au 1er hit) pour éviter que le cold-start ne dépasse les timeouts Playwright.
          curl -s -o /dev/null -X POST http://localhost:8088/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.silaris.app","password":"password"}' || true
          curl -s -o /dev/null http://localhost:3000/dashboard || true
          pnpm --filter @silaris/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
