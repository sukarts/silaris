# Sidecar nginx devant php-fpm (pod api en K8s / service en compose prod)
server {
    listen 8080;
    root /var/www/public;
    index index.php;
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        # nginx et php-fpm sont dans des conteneurs distincts : chemin fixe côté fpm
        # (nginx n'a pas les fichiers, $realpath_root serait vide).
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        include fastcgi_params;
    }
}
