name: silaris-prod-rehearsal

# Répétition go-live : le stack production complet en local (images buildées localement).
# En vrai prod, api/web/worker/scheduler viennent de GHCR ; postgres/redis/meili/minio
# sont remplacés par des services managés.

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: http://localhost:8090
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: silaris
  DB_USERNAME: silaris_login
  DB_PASSWORD: silaris_prod_pw
  DB_SYSTEM_CONNECTION: pgsql_system
  DB_SYSTEM_USERNAME: postgres
  DB_SYSTEM_PASSWORD: silaris_root_pw
  REDIS_HOST: redis
  REDIS_CLIENT: predis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: cookie
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: prod_meili_key
  DOCUMENTS_DISK: s3
  AWS_ACCESS_KEY_ID: silaris
  AWS_SECRET_ACCESS_KEY: silaris_prod_minio
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: silaris-documents
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: silaris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: silaris_root_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment: { MEILI_MASTER_KEY: prod_meili_key, MEILI_ENV: production }

  minio:
    image: minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: silaris, MINIO_ROOT_PASSWORD: silaris_prod_minio }
    volumes: [minio_data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set l http://minio:9000 silaris silaris_prod_minio;
      mc mb --ignore-existing l/silaris-documents; exit 0"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025"]

  migrate:
    image: silaris-api:test
    # Superuser : crée tables + rôle silaris_app (migration RLS), seed référentiels,
    # puis rattache le rôle applicatif silaris_login à silaris_app.
    environment:
      <<: *app-env
      DB_USERNAME: postgres
      DB_PASSWORD: silaris_root_pw
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan identity:grant-app-role silaris_login"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: silaris-api:test
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8090:8080"]
    depends_on: [api]

  worker:
    image: silaris-api:test
    command: ["php", "artisan", "horizon"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  scheduler:
    image: silaris-api:test
    command: ["php", "artisan", "schedule:work"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: silaris-web:test
    ports: ["3001:3000"]

volumes:
  pgdata:
  minio_data:
