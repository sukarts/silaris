apiVersion: apps/v1
kind: Deployment
metadata:
  name: silaris-worker
  labels: { app: silaris, component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: silaris, component: worker }
  template:
    metadata:
      labels: { app: silaris, component: worker }
    spec:
      terminationGracePeriodSeconds: 60 # laisse Horizon finir les jobs en cours
      containers:
        - name: horizon
          image: ghcr.io/OWNER/silaris-api:latest
          command: ["php", "artisan", "horizon"]
          envFrom:
            - configMapRef: { name: silaris-config }
            - secretRef: { name: silaris-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          lifecycle:
            preStop:
              exec: { command: ["php", "artisan", "horizon:terminate"] }
