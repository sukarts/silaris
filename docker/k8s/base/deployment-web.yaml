apiVersion: apps/v1
kind: Deployment
metadata:
  name: silaris-web
  labels: { app: silaris, component: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: silaris, component: web }
  template:
    metadata:
      labels: { app: silaris, component: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/silaris-web:latest
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 5
