# Blueprint Render — MVP SILARIS. Docs : https://render.com/docs/blueprint-spec
# Provisionne API + web + worker + scheduler + PostgreSQL + Redis managés.
# Meilisearch, stockage S3 (R2/AWS) et SMTP : services externes (voir docs/exploitation/guide-deploiement-mvp.md).

databases:
  - name: silaris-postgres
    plan: standard            # Postgres managé : sauvegardes + PITR gérés par Render
    postgresMajorVersion: "16"

services:
  # ── API (php-fpm + nginx via l'image prod) ───────────────────────────────
  - type: web
    name: silaris-api
    runtime: image
    image:
      url: ghcr.io/sukarts/silaris-api:latest   # publié par build.yml
    plan: standard
    healthCheckPath: /api/v1/health
    preDeployCommand: "php artisan migrate --force"   # migration avant bascule
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false                                    # secret — collé dans le dashboard
      - key: APP_URL
        fromService: { type: web, name: silaris-api, property: host }
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: silaris-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: silaris-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: silaris-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: silaris-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: silaris-postgres, property: password }
      - key: DB_SYSTEM_CONNECTION
        value: pgsql                                   # MVP : app = propriétaire ; durcir en rôle non-propriétaire ensuite
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: silaris-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: silaris-redis, property: port }
      - key: REDIS_CLIENT
        value: predis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: cookie
      - key: SCOUT_DRIVER
        value: meilisearch
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_KEY
        sync: false
      - key: DOCUMENTS_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # ── Worker Horizon ───────────────────────────────────────────────────────
  - type: worker
    name: silaris-worker
    runtime: image
    image: { url: ghcr.io/sukarts/silaris-api:latest }
    plan: standard
    dockerCommand: "php artisan horizon"
    envVars:
      - fromGroup: silaris-shared

  # ── Scheduler (Render Cron déclenchant schedule:run) ─────────────────────
  - type: cron
    name: silaris-scheduler
    runtime: image
    image: { url: ghcr.io/sukarts/silaris-api:latest }
    schedule: "* * * * *"
    dockerCommand: "php artisan schedule:run"
    envVars:
      - fromGroup: silaris-shared

  # ── Frontend Next.js ─────────────────────────────────────────────────────
  - type: web
    name: silaris-web
    runtime: image
    image: { url: ghcr.io/sukarts/silaris-web:latest }
    plan: standard
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: { type: web, name: silaris-api, property: host }

# Groupe partagé worker/cron (mêmes secrets DB/Redis/etc. que l'API — voir dashboard)
envVarGroups:
  - name: silaris-shared
    envVars:
      - key: APP_ENV
        value: production
