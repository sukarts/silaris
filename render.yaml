# Blueprint Render — MVP SILARIS. Docs : https://render.com/docs/blueprint-spec
# Provisionne API + web + worker + scheduler + PostgreSQL + Redis (Key Value) managés.
# Meilisearch, stockage S3 (R2/AWS) et SMTP : services externes (voir
# docs/exploitation/guide-deploiement-mvp.md). Toute valeur `sync: false` se colle
# dans le dashboard Render au premier déploiement (secrets — jamais dans le repo).
#
# L'API, le worker et le cron partagent EXACTEMENT le même environnement : il est
# défini une fois via l'ancre YAML `&api-env` puis réutilisé (`*api-env`). Les ancres
# sont résolues par le parseur YAML avant Render — worker/cron reçoivent donc bien
# toutes les variables DB/Redis/secrets (sinon ils ne démarrent pas).

databases:
  - name: silaris-postgres
    plan: basic-1gb           # Postgres managé (plan courant) : sauvegardes quotidiennes + PITR
    postgresMajorVersion: "16"

services:
  # ── Redis managé (Render Key Value) ──────────────────────────────────────
  - type: keyvalue
    name: silaris-redis
    plan: standard
    ipAllowList: []           # accessible uniquement depuis le réseau privé Render

  # ── API (php-fpm + nginx via l'image prod) ───────────────────────────────
  - type: web
    name: silaris-api
    runtime: image
    image:
      url: "ghcr.io/sukarts/silaris-api:latest"     # publié par build.yml
    plan: standard
    healthCheckPath: /api/v1/health
    # Render exécute preDeployCommand sans shell (pas de && ni sh -c fiable) :
    # une seule commande. Le seed des référentiels se fait une fois via le Shell
    # (php artisan db:seed --force) — voir guide-deploiement-mvp.md.
    preDeployCommand: "php artisan migrate --force"
    envVars: &api-env
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false                                # secret — `php artisan key:generate --show`
      - key: APP_URL
        sync: false                                # ex. https://silaris-api.onrender.com
      - key: FRONTEND_URL
        value: "https://silaris-web.onrender.com"  # liens des emails (reset, invitation, portail)
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: silaris-postgres, property: host }
      - key: DB_PORT
        fromDatabase: { name: silaris-postgres, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: silaris-postgres, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: silaris-postgres, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: silaris-postgres, property: password }
      # MVP : l'app se connecte en propriétaire → DB_SYSTEM_CONNECTION = pgsql.
      # Durcissement post-MVP : créer un rôle non-propriétaire silaris_login et
      # pointer les creds applicatifs dessus, DB_SYSTEM_* restant sur le propriétaire.
      - key: DB_SYSTEM_CONNECTION
        value: pgsql
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: silaris-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: silaris-redis, property: port }
      - key: REDIS_CLIENT
        value: predis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: cookie
      - key: SCOUT_DRIVER
        value: meilisearch
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_KEY
        sync: false
      - key: DOCUMENTS_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false                                # ex. https://<account>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

  # ── Worker Horizon (files : outbox, notifications, sync Odoo) ─────────────
  - type: worker
    name: silaris-worker
    runtime: image
    image: { url: "ghcr.io/sukarts/silaris-api:latest" }
    plan: standard
    dockerCommand: "php artisan horizon"
    envVars: *api-env

  # ── Scheduler (Render Cron → schedule:run chaque minute) ─────────────────
  - type: cron
    name: silaris-scheduler
    runtime: image
    image: { url: "ghcr.io/sukarts/silaris-api:latest" }
    schedule: "* * * * *"
    dockerCommand: "php artisan schedule:run"
    envVars: *api-env

  # ── Frontend Next.js (image standalone) ──────────────────────────────────
  - type: web
    name: silaris-web
    runtime: image
    image: { url: "ghcr.io/sukarts/silaris-web:latest" }
    plan: standard
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false                                # URL publique de silaris-api + /api (SANS /v1 : le client l'ajoute)
